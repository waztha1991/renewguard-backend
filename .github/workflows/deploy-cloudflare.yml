name: Deploy RenewGuard Backend (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install deploy dependencies
        run: npm install --no-fund --no-audit --legacy-peer-deps

      - name: Deploy Worker + Container (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --containers-rollout=immediate

      # This deploys renewguard-backend-dev to your *.workers.dev subdomain.
      # Your existing production Worker is untouched. When you're ready to
      # promote to real production, add a `routes`/custom domain back to
      # wrangler.jsonc (or a wrangler.jsonc "env.production" block) and a
      # separate workflow/branch trigger for it.
